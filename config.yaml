# bb-agent configuration
model: llama3.1              # default ollama model (override with --model)
reconftw_path: ~/reconftw/reconftw.sh
max_steps: 15

# Phase 2
kb_path: ./kb               # technique knowledge base (relative = project root)
max_fallback_attempts: 3    # fallbacks tried per failed command
auto_note_findings: true    # auto-record findings when a keyword appears in output
finding_keywords: ["200 OK", "reflected", "error in your SQL", "internal server error", "access denied bypass"]

# Binaries auto-executed in --mode auto without asking.
# Anything not listed here always prompts, even in auto mode.
passive_whitelist:
  - reconftw      # only when invoked in passive mode (-p), enforced in tools.py
  - subfinder
  - httpx         # probe only; fuzzing flags are rejected
  - curl          # GET only; write/other methods are rejected
  - whois
  - dig
  - nslookup

# Phase 3
reports_dir: ./reports
default_platform: hackerone

# Scope enforcement. Empty lists = no restriction (everything allowed).
# Fill these in per program BEFORE running against real targets.
# Wildcard: "*.example.com" matches sub.example.com but NOT example.com itself.
scope:
  domains: []        # e.g. ["*.example.com", "example.com"]
  excluded: []       # e.g. ["admin.example.com", "*.internal.example.com"]
  ip_ranges: []      # e.g. ["10.0.0.0/8"]
  max_severity_auto: medium

# Phase 4
resume_skip_duplicates: true   # on --resume, skip commands already run

# Phase 5 - AI target mode (--ai-mode). endpoint is overridden by --target.
ai_target:
  endpoint: ""
  method: POST
  headers: {}                                   # add auth headers if needed
  payload_template: '{"message": "{{PAYLOAD}}"}'  # {{PAYLOAD}} is JSON-escaped in
  response_path: "response.text"                # dot-path to the reply in the JSON response
  request_delay: 2                              # seconds between requests (rate-limit safety)

# Phase 6 - real-hunt utilities
rate_limits:
  default_delay: 2          # seconds to wait before each command
  per_target:               # wildcard host -> delay (overrides default)
    "*.hackerone.com": 5
    "*.bugcrowd.com": 3

nuclei:
  enabled: true             # auto-scan in-scope hosts after passive recon
  severity: "medium,high,critical"

notify:                     # --notify telegram|discord fires on each finding
  telegram:
    bot_token: ""
    chat_id: ""
  discord:
    webhook_url: ""

# Phase 7 - LLM provider + tracing
llm:
  provider: ollama          # ollama | gemini | claude | openai
  model: llama3.1
  gemini_api_key: ""        # or set GEMINI_API_KEY env var
  ollama_model: llama3.1    # fallback if gemini fails
trace:
  enabled: true
  show_summary: true
