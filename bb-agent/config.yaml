# bb-agent configuration
model: llama3.1              # default ollama model (override with --model)
reconftw_path: ~/reconftw/reconftw.sh
max_steps: 15

# Phase 2
kb_path: ./kb               # technique knowledge base (relative = project root)
max_fallback_attempts: 3    # fallbacks tried per failed command
auto_note_findings: true    # auto-record findings when a keyword appears in output
finding_keywords: ["200 OK", "reflected", "error in your SQL", "internal server error", "access denied bypass"]

# Binaries auto-executed in --mode auto without asking.
# Anything not listed here always prompts, even in auto mode.
passive_whitelist:
  - reconftw      # only when invoked in passive mode (-p), enforced in tools.py
  - subfinder
  - httpx         # probe only; fuzzing flags are rejected
  - curl          # GET only; write/other methods are rejected
  - whois
  - dig
  - nslookup
